# Draft app name; confirm availability before creation. Run deploy from repo root.
app = "afterkey-api-techbone"
primary_region = "fra"

[build]
dockerfile = "apps/api/Dockerfile"

[env]
NODE_ENV = "production"
API_STORAGE = "postgres"
API_HOST = "0.0.0.0"
API_PORT = "8080"
FRONTEND_ORIGIN = "https://after-key-web.vercel.app"
SOLANA_RPC_URL = "https://api.devnet.solana.com"
POLL_INTERVAL_SECONDS = "30"
NOTIFICATIONS_DELIVERY_ENABLED = "false"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1

[[http_service.checks]]
interval = "30s"
timeout = "15s"
grace_period = "60s"
method = "GET"
path = "/healthz"

[[vm]]
cpu_kind = "shared"
cpus = 1
memory = "512mb"
