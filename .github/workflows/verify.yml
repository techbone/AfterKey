name: Verify AfterKey

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: afterkey
          POSTGRES_PASSWORD: afterkey_test_only
          POSTGRES_DB: afterkey_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U afterkey -d afterkey_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:api
        env:
          AFTERKEY_TEST_DATABASE_URL: postgresql://afterkey:afterkey_test_only@127.0.0.1:5432/afterkey_test
      - run: npm run test:unit
      - run: npm run build --workspace @afterkey/web
      - name: Install pinned Solana build tools
        run: |
          curl -fsSL --retry 3 https://github.com/anza-xyz/agave/releases/download/v2.1.0/solana-release-x86_64-unknown-linux-gnu.tar.bz2 -o "$RUNNER_TEMP/solana.tar.bz2"
          tar -xjf "$RUNNER_TEMP/solana.tar.bz2" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/solana-release/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/solana/v1.51
            ~/.cargo/registry
          key: ${{ runner.os }}-sbf-v1.51-${{ hashFiles('Cargo.lock') }}
      - name: Standard timing build and full contract suite
        run: npm test
      - name: Short timing build and lifecycle regressions
        run: npm run test:devnet
